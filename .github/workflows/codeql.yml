name: CodeQL

# Java/Kotlin 安全扫描：结果进 Security → Code scanning，并在 PR 上留检查与行内告警。
# 编译型语言必须在 init 与 analyze 之间真实构建一次，CodeQL 才能拿到完整 classpath；
# 本仓库是 Maven 多模块（lake-service 只能用 JDK 21 编译），所以走 manual build 而不是 autobuild。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # 每周一 03:27 UTC 补一次全量扫描：兜住长期没改的代码和 CodeQL 新规则
    - cron: '27 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# analyze 需要把 SARIF 上传到 Code scanning；私有仓库还需 contents/actions read。
permissions:
  actions: read
  contents: read
  security-events: write

env:
  MAVEN_OPTS: -Xmx2g

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 全 reactor 用 JDK 21 构建（spark 模块产出 Java 17 字节码），与 ci.yml 保持一致
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # security-extended 比默认套件覆盖更多安全查询；扫描范围见 codeql-config.yml
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # 不跑测试（CI 的 mvn verify 已跑），但要编译测试源码，保证 classpath 与 CI 一致
      - name: Build
        run: mvn -B -ntp -DskipTests package

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
