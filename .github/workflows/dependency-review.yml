name: Dependency Review

# PR 依赖门禁：展示依赖 diff，并拦下新增的高危漏洞版本（需先在设置里开 Dependency graph）。
# 只需 GITHUB_TOKEN 的 contents: read；私有仓库需开启 GitHub Code Security。
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
