# 本地湖仓基础设施（演示 / 开发用，勿直接上生产）
#
# 组件：Postgres(元数据库) + MinIO(对象存储) + Hive Metastore(Iceberg catalog) + Presto(即席查询)
#
#   bin/infra.sh up              # 起核心四件套
#   bin/infra.sh up tools        # 额外起 Adminer（Postgres 网页客户端 :8081）
#   bin/infra.sh doctor          # 健康检查 + 端到端查询
#   bin/infra.sh clean           # 停掉并删除数据卷
#
# 安装 Docker、镜像加速、扩展新依赖：见 infra/README.md
#
# 设计约定：
#   - 端口只绑 127.0.0.1，不暴露到局域网；
#   - 网络名固定为 lakehouse-net，临时容器可以 --network lakehouse-net 接进来；
#   - 可选服务用 profiles: ["tools"]，不加 --profile 不会启动；
#   - 所有镜像都钉版本，避免 latest 漂移（MinIO 社区镜像已下线，见下方注释）。
name: lakehouse-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  lake:
    name: lakehouse-net

volumes:
  pgdata:
  miniodata:
  prestodata:

services:
  # ---------------------------------------------------------------- 元数据库
  postgres:
    image: postgres:16-alpine
    container_name: lake-postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- 对象存储
  # MinIO 社区版的 Docker 镜像已于 2026 年从 Docker Hub / Quay 下线
  # （minio/minio 与 minio/mc 都是 404），这里用 Bitnami 归档镜像兜底。
  # 仅限本地开发；生产请换企业对象存储，或自行从源码构建 MinIO。
  minio:
    image: bitnamilegacy/minio:2025.7.23
    container_name: lake-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DEFAULT_BUCKETS: lake
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 控制台
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- Hive Metastore
  # 元数据走 Postgres；数据文件由 Spark / Presto 直接读写 MinIO。
  # 镜像在 ./hive 里加了一层：Postgres JDBC 驱动 + S3A（hadoop-aws）+ 幂等的 schema 初始化。
  #
  # HMS 不是“完全不碰数据”：建 database 时它要把库目录 mkdirs 到 s3a://lake/warehouse/<db>，
  # 所以镜像里带了 hadoop-aws，S3A 的 endpoint / 凭据由 ./hive/core-site.xml 提供
  # （JVM 的 -Dfs.s3a.* 对 Hadoop Configuration 不生效）。
  hive-metastore:
    build:
      context: ./hive
    image: lakehouse-demo/hive-metastore:3.1.3
    container_name: lake-hms
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=s3a://lake/warehouse
    volumes:
      - ./hive/core-site.xml:/opt/hive/conf/core-site.xml:ro
    ports:
      - "127.0.0.1:9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- Presto
  presto:
    image: prestodb/presto:0.290
    container_name: lake-presto
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./presto/etc:/opt/presto-server/etc:ro
      - prestodata:/var/lib/presto/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/info', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s
    mem_limit: 2g
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- 可选工具
  adminer:
    image: adminer:4
    container_name: lake-adminer
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]
