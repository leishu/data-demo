# 本地湖仓基础设施（演示 / 开发用，勿直接上生产）
#
# 组件：Postgres(元数据库) + MinIO(对象存储) + Hive Metastore(Iceberg catalog) + Trino(即席查询)
#
#   bin/infra.sh up              # 起 Postgres + MinIO + HMS（Trino 按需）
#   bin/infra.sh up tools        # 额外起 Adminer（Postgres 网页客户端 :8081）
#   bin/infra.sh doctor          # 健康检查 + 端到端查询
#   bin/infra.sh clean           # 停掉并删除数据卷
#
# 安装 Docker、镜像加速、扩展新依赖：见 infra/README.md
#
# 设计约定：
#   - 端口只绑 127.0.0.1，不暴露到局域网；
#   - 网络名固定为 lakehouse-net，临时容器可以 --network lakehouse-net 接进来；
#   - 可选服务用 profiles: ["tools"]，不加 --profile 不会启动；
#   - 所有镜像都钉版本，避免 latest 漂移（MinIO 社区镜像已下线，见下方注释）。
name: lakehouse-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  lake:
    name: lakehouse-net

volumes:
  pgdata:
  miniodata:
  trinodata:

services:
  # ---------------------------------------------------------------- 元数据库
  postgres:
    image: postgres:16-alpine
    container_name: lake-postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      # 健康检查间隔放粗：5s 一次会频繁 fork 探测进程，白占 CPU 和瞬时内存
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- 对象存储
  # MinIO 社区版的 Docker 镜像已于 2026 年从 Docker Hub / Quay 下线
  # （minio/minio 与 minio/mc 都是 404），这里用 Bitnami 归档镜像兜底。
  # 仅限本地开发；生产请换企业对象存储，或自行从源码构建 MinIO。
  minio:
    image: bitnamilegacy/minio:2025.7.23
    container_name: lake-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DEFAULT_BUCKETS: lake
      # Go 运行时软内存上限：推高 GC 频率，把空闲 RSS 从 ~290M 压到 ~250M。
      # 是软限制，超了不会 OOM，只会更勤快地回收。
      GOMEMLIMIT: 256MiB
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 控制台
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- Hive Metastore
  # 元数据走 Postgres；数据文件由 Spark / Trino 直接读写 MinIO。
  # 镜像在 ./hive 里加了一层：Postgres JDBC 驱动 + S3A（hadoop-aws）+ 幂等的 schema 初始化。
  #
  # HMS 不是“完全不碰数据”：建 database 时它要把库目录 mkdirs 到 s3a://lake/warehouse/<db>，
  # 所以镜像里带了 hadoop-aws，S3A 的 endpoint / 凭据由 ./hive/core-site.xml 提供
  # （JVM 的 -Dfs.s3a.* 对 Hadoop Configuration 不生效）。
  hive-metastore:
    build:
      context: ./hive
    image: lakehouse-demo/hive-metastore:3.1.3
    container_name: lake-hms
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # 官方 /entrypoint.sh 里把 -Xmx1G 写死了，而 JVM 对重复的 -Xmx 取最后一个，
      # 所以在这里追加 -Xmx512m 覆盖它（HMS 实际只用得到 300~400M 堆）。
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=s3a://lake/warehouse
        -Xmx512m
    volumes:
      - ./hive/core-site.xml:/opt/hive/conf/core-site.xml:ro
    ports:
      - "127.0.0.1:9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9083'"]
      interval: 30s
      timeout: 5s
      retries: 20
      # schematool 初始化 + JVM 冷启动偏慢，首检给足时间
      start_period: 60s
    mem_limit: 896m
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- Trino
  trino:
    image: trinodb/trino:476
    container_name: lake-trino
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # 整目录只读挂载：config / node / jvm / catalog 全部来自 infra/trino/etc
      - ./trino/etc:/etc/trino:ro
      - trinodata:/data/trino
    healthcheck:
      # 镜像自带 curl，直接探 coordinator 信息接口
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8080/v1/info >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 20
      # Trino 冷启动（加载 connector + 连 HMS）比 Presto 稍慢，首检给足时间
      start_period: 90s
    mem_limit: 1536m
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]

  # ---------------------------------------------------------------- 可选工具
  adminer:
    image: adminer:4
    container_name: lake-adminer
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    networks: [lake]
