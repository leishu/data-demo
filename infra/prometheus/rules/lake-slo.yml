# 告警规则与 docs/OBSERVABILITY.md 的 SLI/SLO、建议告警一一对应。
# demo 阈值比 SLO 目标宽（目标是「坏掉要有明确定义」，不是生产 SLA）。
groups:
  - name: lake-slo
    rules:
      - alert: LakeQueryErrorRateHigh
        expr: |
          sum(rate(lake_query_executed_total{outcome="error"}[5m]))
            / clamp_min(sum(rate(lake_query_executed_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
          slo: query-availability
        annotations:
          summary: "查询错误率 > 5%（持续 5 分钟）"
          description: "先看 /actuator/health 的 trino 组件，再查 lake_query_quota_rejected_total。"

      - alert: LakeQueryLatencyP95High
        expr: |
          histogram_quantile(0.95, sum(rate(lake_query_duration_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
          slo: query-latency
        annotations:
          summary: "查询 P95 延迟 > 5s"
          description: "SLO 目标是 30 天 P95 ≤ 5s；先看 Trino 连接池与慢 SQL。"

      - alert: LakeBatchFailureRateHigh
        expr: |
          sum(rate(lake_batch_completed_total{status=~"FAILED|TIMEOUT"}[1h]))
            / clamp_min(sum(rate(lake_batch_completed_total[1h])), 1) > 0.1
        for: 15m
        labels:
          severity: warning
          slo: batch-success
        annotations:
          summary: "批作业失败率 > 10%（持续 15 分钟）"
          description: "看 logs/batch/*.log 与审计里 batch.completed 的 status 分布。"

      - alert: LakeQueueDepthHigh
        expr: lake_batch_queue_depth > 20
        for: 10m
        labels:
          severity: warning
          slo: batch-queue
        annotations:
          summary: "排队作业 > 20（持续 10 分钟）"
          description: "调大 lake.batch.max-concurrent-jobs，或检查是否有作业卡在 RUNNING。"

      - alert: LakeServiceDown
        expr: up{job="lake-service"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "lake-service 抓取失败"
          description: "确认服务进程与 /actuator/prometheus 的鉴权配置；Prometheus 用的是 operator 账号。"

      # 新鲜度与质量：服务只暴露数字，阈值比较放在告警侧，避免两边各维护一份 SLA。
      - alert: LakeFreshnessSlaBreached
        expr: |
          lake_governance_freshness_hours >= 0
            and lake_governance_freshness_hours > on(table) lake_governance_freshness_sla_hours
        for: 10m
        labels:
          severity: warning
          slo: freshness
        annotations:
          summary: "湖表新鲜度超过 SLA（{{ $labels.table }}）"
          description: "最近快照距今 {{ $value }} 小时，已超过 GovernanceCatalog 里的 SLA；先查 ingest / transform 是否还在跑。"

      - alert: LakeQualityCheckFailed
        expr: lake_governance_dq_failed{severity="ERROR"} == 1
        for: 5m
        labels:
          severity: critical
          slo: quality
        annotations:
          summary: "质量检查 ERROR 失败（{{ $labels.check }}）"
          description: "ops.dq_results 的最新一条 observed 已超 threshold；去治理页按 run_id 跳作业日志看证据。"

      - alert: LakeQualityWarnCheckFailed
        expr: lake_governance_dq_failed{severity="WARN"} == 1
        for: 15m
        labels:
          severity: warning
          slo: quality
        annotations:
          summary: "质量检查 WARN 超阈值（{{ $labels.check }}）"
          description: "连续 15 分钟未恢复；WARN 不阻断作业，但需要人工确认数据是否仍可用。"
