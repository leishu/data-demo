# HMS 侧 Ranger 插件模板（install.properties 的关键项）。
# 放到 Ranger 插件目录后按 infra/ranger/README.md 的步骤安装；不要提交真实口令。
RANGER_PLUGIN_TYPE=hive
RANGER_HIVE_REPOSITORIES=lakehouse_hive
RANGER_HIVE_LIB_PATH=/opt/hive/lib

POLICY_MGR_URL=http://ranger.example.com:6080
REPOSITORY_NAME=lakehouse_hive

# 插件从 Ranger Admin 拉策略时用的服务账号
RANGER_ADMIN_USERNAME=rangeradmin
RANGER_ADMIN_PASSWORD=CHANGE_ME

# HMS 的认证主体（Kerberos 环境改成实际 principal）
RANGER_HIVE_PRINCIPAL=hive/_HOST@EXAMPLE.COM
RANGER_HIVE_KEYTAB=/etc/security/keytabs/hive.keytab

# 审计写到 Ranger Admin；本地保留一份便于排障
XAAUDIT.DB.IS_ENABLED=false
XAAUDIT.SOLR.IS_ENABLED=false
XAAUDIT.LOG4J.IS_ENABLED=true
