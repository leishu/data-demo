# 生产模板：= infra/trino/etc/config.properties + LDAP 认证开关。
# 只有启用 --profile security 时才会覆盖 /etc/trino/config.properties。
# 修改基础配置时请同步这里；本文件不用于本地 demo（没有 LDAP 服务会起不来）。
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

query.max-memory=512MB
query.max-memory-per-node=256MB
query.max-total-memory=768MB

# 用户名密码认证，账号由 password-authenticator.properties 指向的 LDAP 校验
http-server.authentication.type=PASSWORD
# 客户端证书 / header 伪造的远程用户一概不认
http-server.authentication.allow-forwarded-remote-user=false
