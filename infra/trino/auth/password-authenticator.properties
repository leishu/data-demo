# LDAP 认证模板：把 ldaps://ldap.example.com 与 DC 改成实际目录服务。
# 生产必须用 ldaps + 可信 CA；不要图省事用 ldap:// 明文。
password-authenticator.name=ldap
ldap.url=ldaps://ldap.example.com:636
ldap.allow-insecure=false
ldap.user-bind-pattern=uid=${USER},ou=people,dc=example,dc=com

# 如果用户组织扁平，可用下面的邮箱后缀映射替代上面的 bind pattern：
# ldap.user-bind-pattern=${USER}@example.com
