connector.name=iceberg
# Trino 里 Hive Metastore 的 catalog 类型名是 hive_metastore（不是 Presto 的 hive）
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://hive-metastore:9083
hive.metastore.username=hive

iceberg.file-format=PARQUET
# 允许 CALL iceberg.system.register_table 等过程（Trino 特有开关）
iceberg.register-table-procedure.enabled=true

# MinIO（S3 兼容）：用 Trino 原生 S3 文件系统，支持 s3:// / s3a:// / s3n:// 三种 scheme，
# 所以 Spark 用 s3a://lake/warehouse 写、Trino 直接读没问题。
# 旧的 hive.s3.* 配置已废弃，新版本会移除。
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
