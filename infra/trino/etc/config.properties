# 单节点 coordinator（本地演示用）
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# 与 jvm.config 的 -Xmx768m 对齐：query.max-memory（512MB）是单查询上限，
# 堆留出 1.5 倍余量给执行算子/元数据，避免堆内堆外叠加把容器打爆。
# 注意：presto 时代的 query.max-total-memory-per-node 在 Trino 里已是 defunct 属性，
# 写了会直接拒绝启动；总内存上限换成集群级的 query.max-total-memory，
# 且它必须 >= query.max-memory，否则启动即报 maxQueryMemory cannot be greater than maxQueryTotalMemory。
query.max-memory=512MB
query.max-memory-per-node=256MB
query.max-total-memory=768MB
