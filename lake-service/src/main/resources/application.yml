server:
  port: 8088
  # Reactor Netty 也认这个：停机时先让在途请求（含 SSE）走完
  shutdown: graceful

spring:
  application:
    name: lake-service
  # 这里没有 spring.threads.virtual：WebFlux 的请求线程就是 Netty 事件循环，不是 Tomcat 工作线程。
  # 真正需要虚拟线程的是被 offload 出去的阻塞 JDBC / 文件 IO，见 LakeConfiguration#blockingScheduler
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: lake-service
    stack: JDK 21 + Spring Boot 4 (WebFlux/Netty) + logback + Presto JDBC + HikariCP + SSE

lake:
  # 与 Spark / CLI 共用 platform-common 的配置来源，这里只指路
  conf-file: conf/platform.properties
  query:
    max-rows: 1000
    timeout-seconds: 60
    pool-size: 8
    allow-writes: false
  batch:
    enabled: true
    # 换成集群提交：spark-submit --master yarn --class com.demo.lake.batch.BatchApp <jar> --job {job}
    command-template: bin/dev-batch.sh --job {job}
    work-dir: .
    log-dir: logs/batch
    timeout-seconds: 1800

logging:
  level:
    root: INFO
    com.demo.lake: INFO
