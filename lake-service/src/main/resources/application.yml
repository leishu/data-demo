server:
  port: 8088
  # Reactor Netty 也认这个：停机时先让在途请求（含 SSE）走完
  shutdown: graceful

spring:
  application:
    name: lake-service
  # 这里没有 spring.threads.virtual：WebFlux 的请求线程就是 Netty 事件循环，不是 Tomcat 工作线程。
  # 真正需要虚拟线程的是被 offload 出去的阻塞 JDBC / 文件 IO，见 LakeConfiguration#blockingScheduler
  lifecycle:
    timeout-per-shutdown-phase: 20s

# 接口文档：OpenAPI JSON + Swagger UI。路径显式写在这里，改反代规则时一眼能看到
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  # 已有 @RestControllerAdvice 统一错误体，别再给每个接口塞一个泛化的 500 响应
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        # prometheus：Micrometer 的抓取端点（需 BATCH 角色，Prometheus 配置里用 operator 账号）
        include: health,info,metrics,loggers,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: lake-service
    stack: JDK 21 + Spring Boot 4 (WebFlux/Netty) + logback + Trino JDBC + HikariCP + SSE

lake:
  # 与 Spark / CLI 共用 platform-common 的配置来源，这里只指路
  conf-file: conf/platform.properties
  query:
    max-rows: 1000
    timeout-seconds: 60
    pool-size: 8
    allow-writes: false
    # 查询配额：并发名额 + 单账号每分钟次数，超了返回 429
    max-concurrent-queries: 4
    max-queries-per-minute: 60
    acquire-timeout-ms: 3000
  # demo 级鉴权：HTTP Basic + 静态账号，无会话。生产请关掉并由网关/IdP 接管
  security:
    enabled: true
    realm: lakehouse
    accounts:
      - username: viewer
        password: "{noop}viewer"
        roles: [QUERY]
      - username: operator
        password: "{noop}operator"
        roles: [QUERY, BATCH]
      - username: auditor
        password: "{noop}auditor"
        roles: [AUDITOR]
  # 合规用的查询原文保险箱：默认关；开启必须同时提供 LAKE_AUDIT_KEY（base64 32 字节）
  audit:
    sql-capture-enabled: false
    redact: true
    retention-days: 30
    key-id: v1
    # 密钥轮换时把旧密钥也留在这里（环境变量 LAKE_AUDIT_KEYS_V1 / LAKE_AUDIT_KEYS_V2 ...），
    # 否则换了 LAKE_AUDIT_KEY 之后，旧 key_id 写的历史原文会解不开
    # keys:
    #   v1: <base64 32 字节>
  batch:
    enabled: true
    # 换成集群提交：spark-submit --master yarn --class com.demo.lake.batch.BatchApp <jar> --job {job}
    command-template: bin/dev-batch.sh --job {job}
    work-dir: .
    log-dir: logs/batch
    timeout-seconds: 1800
    # 调度：超过并发上限的作业进 QUEUED，由调度器按提交顺序放行
    max-concurrent-jobs: 2
    dispatch-interval-ms: 1000
    # local=本机子进程；kubernetes=走 K8s Job API（需要 RBAC 与 ServiceAccount）
    executor: local
    kubernetes:
      api-url: https://kubernetes.default.svc
      namespace: default
      image: spark:3.5.1
      service-account: default
      poll-seconds: 5
      timeout-seconds: 1800
    # 运行状态库：复用 infra 的 Postgres，服务重启/多实例都能看到同一份 RUNNING 状态
    state:
      url: jdbc:postgresql://localhost:5432/metastore
      user: hive
      password: hive
      pool-size: 4
      heartbeat-seconds: 15
      stale-after-seconds: 120
      reconcile-seconds: 60
      log-retention-days: 7

logging:
  level:
    root: INFO
    com.demo.lake: INFO
