# =====================================================================
# 默认配置（打包进 jar）。覆盖优先级：本文件 < conf/platform.properties
# < --conf 指定的文件 < 环境变量 LAKE_* < JVM -Dplatform.*
# =====================================================================

# ---- Iceberg 目录 ----
# hadoop: 纯文件系统目录(免元数据服务，本地开发/CI 用)
# hive  : 通过 Hive Metastore 管理元数据(生产用)
platform.catalog.name=iceberg
platform.catalog.type=hadoop
platform.database=lake

# 相对路径会被解析成当前工作目录下的 file:// URI；也可写 s3a://lake/warehouse、hdfs:///warehouse
platform.warehouse=warehouse

# catalog.type=hive 时必填
platform.hive.uri=thrift://localhost:9083

# ---- S3 / MinIO（warehouse 为 s3a:// 时生效） ----
platform.s3.endpoint=http://localhost:9000
platform.s3.region=us-east-1
platform.s3.access-key=admin
platform.s3.secret-key=password
platform.s3.path-style-access=true

# ---- 写入行为 ----
# format-version=2 且 merge/update/delete 走 copy-on-write，
# 这样 Trino 的 Iceberg connector 不需要处理 delete file，跨引擎兼容性最好。
platform.format-version=2
platform.write-mode=copy-on-write

# ---- Spark ----
platform.spark.master=local[*]
platform.spark.shuffle.partitions=8
platform.spark.timezone=UTC

# ---- Trino ----
platform.trino.host=localhost
platform.trino.port=8080
platform.trino.user=demo
platform.trino.source=lakehouse-adhoc
